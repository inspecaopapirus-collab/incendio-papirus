name: Testes automaticos
# Roda a cada pull request e a cada push em main/teste. Nao publica nada:
# usa o emulador do Firebase (projeto demo-*), nunca o banco real.
on:
  pull_request:
  push:
    branches: [main, teste]
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      # o navegador vem do CDN do Playwright; as bibliotecas do sistema ja estao no runner.
      # O "install-deps" usa o apt do Ubuntu, que as vezes fica fora do ar (DNS do espelho):
      # nesse caso so faltam fontes extras, e os testes rodam assim mesmo.
      - run: npx playwright install chromium
      - run: npx playwright install-deps chromium || echo "::warning::apt indisponivel; seguindo com as bibliotecas que o runner ja tem"
      - name: Unidade (datas, gravacao do cadastro)
        run: npm run test:unidade
      - name: Regras do Firestore e app no navegador (emulador)
        run: npm run emulador
