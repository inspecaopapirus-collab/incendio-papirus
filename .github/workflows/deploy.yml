name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # versao desta publicacao: vai para o index.html e para /versao.json; as telas abertas
      # comparam as duas e mostram "o sistema foi atualizado" (ver VERSAO_SITE no index.html)
      - name: Marcar a versao publicada
        run: |
          V="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          grep -q '__VERSAO_SITE__' index.html
          sed -i "s/__VERSAO_SITE__/$V/" index.html
          printf '{"versao":"%s"}\n' "$V" > versao.json
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: incendio-papirus
          # versao fixa: a ultima que publicou o site (29/09/2026). As versoes seguintes passaram
          # a exigir a permissao serviceusage.services.get, que a conta de servico nao tem,
          # e o deploy falhava com 403. Pode voltar para "latest" depois de dar o papel
          # "Service Usage Consumer" a conta de servico.
          firebaseToolsVersion: 15.32.0

  # Publica o firestore.rules (antes era copiar e colar no Console). Antes de publicar,
  # roda os testes das regras no emulador: regra quebrada nao chega ao banco.
  # Precisa que a conta de servico do segredo FIREBASE_SERVICE_ACCOUNT tenha os papeis
  # "Firebase Rules Admin" e "Service Usage Consumer" no Google Cloud.
  regras:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Testar as regras no emulador
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npx firebase emulators:exec --only firestore --project demo-regras "npm run test:regras"
      - name: Publicar as regras no Firestore
        working-directory: tests
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          cd .. && tests/node_modules/.bin/firebase deploy --only firestore:rules --project incendio-papirus --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Como resolver se falhar
        if: failure()
        run: |
          {
            echo "### As regras do Firestore nao foram publicadas"
            echo "O site foi publicado normalmente (job separado). Se o erro fala em permissao (403):"
            echo "no Google Cloud (IAM), de a conta de servico do segredo FIREBASE_SERVICE_ACCOUNT"
            echo "os papeis **Firebase Rules Admin** e **Service Usage Consumer**."
            echo "Enquanto isso, publique copiando o firestore.rules no Console do Firebase."
          } >> "$GITHUB_STEP_SUMMARY"
