name: Deploy canal de teste
on:
  push:
    branches:
      - teste
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: teste
          projectId: incendio-papirus
          expires: 30d
          # versao fixa: a partir da 15.33 o firebase-tools passou a exigir a permissao
          # serviceusage.services.get, que a conta de servico nao tem (deploy falhava com 403)
          firebaseToolsVersion: 15.32.0
